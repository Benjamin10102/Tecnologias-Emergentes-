<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Instagram</title>
    <link rel="stylesheet" href="practica6.css">
</head>
<body>
    <!-- MENÚ LATERAL -->
    <aside class="menu-lateral">
        <h1 class="logo">Instagram</h1>
        <ul>
            <li><a href="#" class="activo"><i class="fa-solid fa-house"></i> Inicio</a></li>
            <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a></li>
            <li><a href="#"><i class="fa-regular fa-compass"></i> Explorar</a></li>
            <li><a href="#"><i class="fa-solid fa-film"></i> Reels</a></li>
            <li><a href="#"><i class="fa-regular fa-paper-plane"></i> Mensajes <span class="insignia">3</span></a></li>
            <li><a href="#"><i class="fa-regular fa-heart"></i> Notificaciones <span class="insignia">7</span></a></li>
            <li><a href="#"><i class="fa-regular fa-square-plus"></i> Crear</a></li>
            <li><a href="#"><img src="imagenes/gato.jpg" alt="Perfil" class="mini"> Perfil</a></li>
        </ul>
        <a href="#" class="mas"><i class="fa-solid fa-bars"></i> Más</a>
    </aside>

    <!-- BARRA SUPERIOR -->
    <nav class="barra-superior">
        <a href="#"><i class="fa-solid fa-house"></i></a>
        <a href="#"><i class="fa-regular fa-paper-plane"></i></a>
        <a href="#"><i class="fa-regular fa-compass"></i></a>
        <a href="#" class="corazon"><i class="fa-regular fa-heart"></i></a>
        <a href="#" class="usuario"><img src="imagenes/gato.jpg" alt="Perfil" class="mini"> <i class="fa-solid fa-chevron-down"></i></a>
    </nav>

    <!-- CONTENIDO -->
    <main>

        <!-- Datos del perfil -->
        <section class="perfil">
            <div class="foto-perfil">
                <img src="imagenes/gato.jpg" alt="mijaeljhonathan">
            </div>

            <div class="datos">
                <div class="fila-usuario">
                    <h2>Benjamin Perez<i class="fa-solid fa-circle-check verificado"></i></h2>
                    <button class="boton azul">Seguir</button>
                    <button class="boton gris">Mensaje</button>
                    <button class="boton gris"><i class="fa-solid fa-user-plus"></i></button>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>

                <div class="estadisticas">
                    <span><strong>256</strong> publicaciones</span>
                    <span><strong>3,870</strong> seguidores</span>
                    <span><strong>1,245</strong> seguidos</span>
                </div>

                <div class="bio">
                    <strong>Benjamin Perez</strong>
                    <p>💻 Ingeniero en Sistemas 💻</p>
                    <p>📍 Tupiza, Bolivia 🇧🇴</p>
                    <p>🚀 Sueña · Crea · Programa</p>
                    <a href="https://www.uatf.edu.bo"><i class="fa-solid fa-link"></i> www.uatf.edu.bo</a>
                </div>
            </div>
        </section>

        

</body>
</html>
